name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  schedule:
    # Weekly, so a dataset change in the monorepo reaches the site.
    - cron: "23 4 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch the shared dataset and generator
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/TeamTrustBridge/paga/main"
          mkdir -p .docs-pipeline/data .docs-pipeline/tools/assets
          curl -fsSL "$base/data/operations.json" -o .docs-pipeline/data/operations.json
          curl -fsSL "$base/tools/build-docs.mjs" -o .docs-pipeline/tools/build-docs.mjs
          curl -fsSL "$base/tools/assets/style.css" -o .docs-pipeline/tools/assets/style.css
          curl -fsSL "$base/tools/assets/script.js" -o .docs-pipeline/tools/assets/script.js

      - name: Generate the site
        run: node .docs-pipeline/tools/build-docs.mjs --language typescript --out docs

      - name: Commit the regenerated site
        # Skip when this workflow triggered the commit, so it cannot loop.
        if: github.actor != 'github-actions[bot]'
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "docs: regenerate the site"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
